# ═══════════════════════════════════════════════════════════════════════════════
# Render Blueprint - Sistema de Gestión Médica Hospitalaria
# ═══════════════════════════════════════════════════════════════════════════════
# Este archivo permite desplegar todos los servicios en Render automáticamente
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # BASE DE DATOS MySQL
  # ═══════════════════════════════════════════════════════════════════════════
  - type: pserv
    name: hospital-mysql
    env: docker
    repo: https://github.com/YormanOna/GRUPO04_SGM_27897.git
    region: oregon
    plan: free
    dockerfilePath: ./Docker Compose/Dockerfile.mysql
    dockerContext: ./
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: GestionMedicaDB
      - key: MYSQL_USER
        value: hospital_user
      - key: MYSQL_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND FastAPI
  # ═══════════════════════════════════════════════════════════════════════════
  - type: web
    name: hospital-backend
    env: docker
    repo: https://github.com/YormanOna/GRUPO04_SGM_27897.git
    region: oregon
    plan: free
    dockerfilePath: ./Docker Compose/Dockerfile.backend
    dockerContext: ./Backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-mysql
          property: connectionString
      - key: DB_HOST
        fromService:
          name: hospital-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: hospital_user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospital-mysql
          property: password
      - key: DB_NAME
        value: GestionMedicaDB
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    autoDeploy: true

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND React + Vite
  # ═══════════════════════════════════════════════════════════════════════════
  - type: web
    name: hospital-frontend
    env: docker
    repo: https://github.com/YormanOna/GRUPO04_SGM_27897.git
    region: oregon
    plan: free
    dockerfilePath: ./Docker Compose/Dockerfile.frontend.prod
    dockerContext: ./Frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hospital-backend
          type: web
          property: hostport
      - key: VITE_WS_URL
        fromService:
          name: hospital-backend
          type: web
          envVarKey: WS_URL
    healthCheckPath: /
    autoDeploy: true

# ═══════════════════════════════════════════════════════════════════════════
# NOTAS DE CONFIGURACIÓN
# ═══════════════════════════════════════════════════════════════════════════
# 
# 1. DESPLIEGUE:
#    - Ve a Render Dashboard: https://dashboard.render.com
#    - Click en "New +" → "Blueprint"
#    - Conecta tu repositorio de GitHub
#    - Render detectará automáticamente este archivo render.yaml
#    - Todos los servicios se desplegarán juntos
# 
# 2. VARIABLES GENERADAS AUTOMÁTICAMENTE:
#    - MYSQL_ROOT_PASSWORD: Contraseña root de MySQL (auto-generada)
#    - MYSQL_PASSWORD: Contraseña del usuario hospital_user (auto-generada)
#    - SECRET_KEY: Clave secreta JWT (auto-generada)
# 
# 3. PLAN FREE:
#    - Todos los servicios usan el plan gratuito
#    - El backend y frontend se suspenden después de 15 minutos de inactividad
#    - Primer request después de suspensión puede tardar ~30 segundos
# 
# 4. REGIONES:
#    - oregon: Servidor en Oregon, USA (menos latencia para América)
#    - Puedes cambiar a: frankfurt, singapore, ohio
# 
# 5. PERSISTENCIA DE DATOS:
#    - MySQL usa un disco persistente de 1GB
#    - Los datos NO se pierden cuando el servicio se reinicia
# 
# 6. URLS DE ACCESO:
#    - Frontend: https://hospital-frontend.onrender.com
#    - Backend: https://hospital-backend.onrender.com
#    - Docs: https://hospital-backend.onrender.com/docs
# 
# 7. AUTO-DEPLOY:
#    - Cada push a la rama main desplegará automáticamente
#    - Puedes desactivarlo cambiando autoDeploy: false
# 
# ═══════════════════════════════════════════════════════════════════════════
